<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footage Finder · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Skin onboarded from the app's own tokens (src/ui/styles.css). */
      --color-paper:   #ffffff;
      --color-ink:     #181d26;
      --color-muted:   #41454d;
      --color-accent:  #aa2d00;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      color: var(--color-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      max-width: 52rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Footage Finder</p>
    <h1>One local app, three processes, one vector space</h1>
    <p class="sub">The Bun host serves the page over a loopback WebSocket, cuts media with ffmpeg, and asks a Python EmbeddingGemma 2 worker for vectors over stdin/stdout. Everything stays on this computer.</p>

      <desc id="footage-finder-architecture-desc">Architecture of Footage Finder: a browser page talks over a loopback WebSocket to a Bun host, which scans the library folder, spawns ffmpeg and pdftoppm to cut clips into the app data folder, stores vectors in SQLite, and gets embeddings from a Python EmbeddingGemma 2 worker that loads its weights from the Hugging Face cache.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#1b61c9"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <text x="400" y="69" fill="rgba(24,29,38,0.48)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL PROCESSES · 127.0.0.1 ONLY</text>

      <rect x="24" y="392" width="912" height="168" rx="8" fill="rgba(24,29,38,0.02)" stroke="rgba(24,29,38,0.12)" stroke-width="0.8"/>
